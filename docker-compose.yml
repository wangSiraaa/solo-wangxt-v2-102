# 离线频谱工作台 —— 一键起 PostgreSQL + FastAPI（前端由后端静态托管）
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spectrum
      POSTGRES_PASSWORD: spectrum
      POSTGRES_DB: spectrum
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectrum"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://spectrum:spectrum@db:5432/spectrum
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
